<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Website test</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            padding: 40px;
            min-height: 400px;
            text-align: center;
        }

        footer {
            background-color: #222;
            color: white;
            padding: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>My Website</h1>
        <p>Welcome to my website</p>
    </header>

    <!-- Body Content -->
    <main>
        <h2>About Us</h2>
        <p>
            This is the main content of the website.
            You can add text, images, buttons, cards, and other sections here.
        </p>

        <button>Learn More</button>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 My Website. All Rights Reserved.</p>
    </footer>

</body>
</html>
